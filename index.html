<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EaglercraftXLauncher — Browse, share and discover Eaglercraft clients, mods and skins." />
    <title>EaglercraftX Hub</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --footer-height: 60px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 24px;
        height: var(--footer-height);
        background: transparent;
        gap: 20px;
        margin-top: auto;
        flex-shrink: 0;
      }

      footer a {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.5px;
        text-decoration: none;
        color: rgba(255, 255, 255, 0.7);
        transition: color 0.2s ease;
        padding: 8px 0;
      }

      footer a:hover {
        color: rgba(255, 255, 255, 1);
      }

      footer a:focus {
        outline: 2px solid rgba(255, 255, 255, 0.5);
        outline-offset: 2px;
        border-radius: 2px;
      }

      @media (max-width: 640px) {
        footer {
          padding: 0 16px;
          gap: 12px;
        }

        footer a {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <footer>
      <a href="./tos.html" rel="noopener noreferrer">Terms of Service</a>
      <a href="./privacy.html" rel="noopener noreferrer">Privacy Policy</a>
    </footer>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
